schemaVersion: 2.0.0
commandTests:
  - name: Linux desktop build runs with the engine precached
    setup:
      - - flutter
        - create
        - test_app
    teardown:
      - - rm
        - -r
        - test_app
    command: bash
    args:
      - -c
      - |
        cd test_app \
        && timeout --preserve-status 480s flutter build linux
    excludedOutput:
      - Checking
      - Installing
      - Downloading
  - name: Linux desktop toolchain is installed
    command: bash
    args:
      - -c
      - |
        command -v clang ld.lld cmake ninja pkg-config \
        && pkg-config --exists gtk+-3.0 libsecret-1 liblzma \
        && test -d /usr/include/c++/12
  - name: Linux desktop configuration is enabled
    command: flutter
    args:
      - config
      - --list
    expectedOutput:
      - "enable-linux-desktop: true"
fileContentTests:
  - name: Dart and Flutter analytics are disabled
    path: /home/flutter/.dart-tool/dart-flutter-telemetry.config
    expectedContents:
      - reporting=0
