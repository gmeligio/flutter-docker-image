name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - changelog.md
  workflow_dispatch:

# Read-only permissions by default
permissions:
  contents: read

# CI on main: latest commit wins; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY_NAME: flutter-android
  VERSION_MANIFEST: config/version.json

jobs:
  test-image:
    name: Test image
    runs-on: ubuntu-26.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Setup mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Validate version manifest
        uses: ./.github/actions/validate-version-manifest

      - name: Read environment variables from the version manifest
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_REPOSITORY_NAME: ${{ env.IMAGE_REPOSITORY_NAME }}
          VERSION_MANIFEST: ${{ env.VERSION_MANIFEST }}
        with:
          script: |
            const script = require('./script/setEnvironmentVariables.js')
            return await script({ core })

      - name: Clean runner disk
        uses: ./.github/actions/clean-runner-disk

      - name: Load image metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: metadata
        with:
          images: |
            ${{ env.IMAGE_REPOSITORY_PATH }}
          tags: |
            type=raw,value=${{ env.FLUTTER_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image and push to local Docker daemon
        uses: ./.github/actions/build-linux-image
        with:
          target: android
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Test image
        run: container-structure-test test --image "${{ fromJSON(steps.metadata.outputs.json).tags[0] }}" --config test/android.yml

      # TEMPORARY (ubuntu-26-runners): measure the peak disk use of a build to
      # size the clean-runner-disk free-space minimum. Remove once measured.
      - name: Report disk usage after build
        if: always()
        run: |
          df -h /
          sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true
          docker system df || true
          docker buildx du 2>/dev/null | tail -n 3 || true
          free_kb=$(df --output=avail / | tail -1 | tr -d ' ')
          used_kb=$(df --output=used / | tail -1 | tr -d ' ')
          awk -v f="$free_kb" -v u="$used_kb" 'BEGIN{printf "disk after build: %.2f GB free, %.2f GB used on /\n", f/1024/1024, u/1024/1024}' | tee -a "$GITHUB_STEP_SUMMARY"

  test-linux-image:
    name: Test Linux desktop image
    runs-on: ubuntu-26.04
    env:
      IMAGE_REPOSITORY_NAME: flutter-linux
      VERSION_MANIFEST: config/version.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Read Flutter version
        id: version
        run: |
          version=$(jq -r '.flutter.version' config/version.json)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "FLUTTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Load image metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: metadata
        with:
          images: flutter-linux
          tags: type=raw,value=${{ steps.version.outputs.value }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image and push to local Docker daemon
        uses: ./.github/actions/build-linux-image
        with:
          target: linux
          load: true
          cache-from: type=gha,scope=flutter-linux
          cache-to: type=gha,mode=max,scope=flutter-linux
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Test image
        run: container-structure-test test --image "${{ fromJSON(steps.metadata.outputs.json).tags[0] }}" --config test/linux.yml

      # TEMPORARY (ubuntu-26-runners): measure the peak disk use of a build to
      # size the clean-runner-disk free-space minimum. Remove once measured.
      - name: Report disk usage after build
        if: always()
        run: |
          df -h /
          sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true
          docker system df || true
          docker buildx du 2>/dev/null | tail -n 3 || true
          free_kb=$(df --output=avail / | tail -1 | tr -d ' ')
          used_kb=$(df --output=used / | tail -1 | tr -d ' ')
          awk -v f="$free_kb" -v u="$used_kb" 'BEGIN{printf "disk after build: %.2f GB free, %.2f GB used on /\n", f/1024/1024, u/1024/1024}' | tee -a "$GITHUB_STEP_SUMMARY"
