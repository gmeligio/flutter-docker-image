name: 'Build Linux Image'
description: >-
  Builds an android.Dockerfile stage with the manifest build args, shared by
  every Linux leg so they cannot drift. Reads the manifest from the env that
  script/setEnvironmentVariables.js exports.

  Composite, not a reusable workflow: the legs need job-local state (ci.yml's
  loaded image, build.yml's steps.handoff/steps.metadata) that a job boundary
  would break.

  The extra build args are Android-only on purpose and inert for the web and
  Linux targets. `windows.git.version` and the Debian `git` apt pin are both
  GIT_VERSION in the env, so a Windows arg here could route the wrong one.

inputs:
  target:
    description: 'Dockerfile stage: `android`, `web`, or `linux`.'
    required: true
  tags:
    description: 'Newline-separated tags.'
    required: true
  labels:
    description: 'Newline-separated labels.'
    required: true
  cache-from:
    description: 'buildx cache-from. Shape and scope vary per leg.'
    required: false
    default: ''
  cache-to:
    description: 'buildx cache-to. Empty on read-only legs.'
    required: false
    default: ''
  push:
    description: 'Push tags to their registries.'
    required: false
    default: 'false'
  load:
    description: 'Load into the local Docker daemon.'
    required: false
    default: 'false'
  sbom:
    description: 'Attach an SBOM attestation.'
    required: false
    default: 'false'
  provenance:
    description: 'Provenance setting (e.g. `mode=max`). Empty keeps the default.'
    required: false
    default: ''

outputs:
  imageid:
    description: 'Built image ID.'
    value: ${{ steps.build.outputs.imageid }}
  digest:
    description: 'Built image digest.'
    value: ${{ steps.build.outputs.digest }}
  metadata:
    description: 'Build result metadata.'
    value: ${{ steps.build.outputs.metadata }}

runs:
  using: composite
  steps:
    - name: Build image
      id: build
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        file: android.Dockerfile
        target: ${{ inputs.target }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        sbom: ${{ inputs.sbom }}
        provenance: ${{ inputs.provenance }}
        # Android-specific args are inert for the web and Linux targets.
        build-args: |
          flutter_version=${{ env.FLUTTER_VERSION }}
          fastlane_version=${{ env.FASTLANE_VERSION }}
          android_java_version=${{ env.ANDROID_JAVA_VERSION }}
          android_build_tools_version=${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          android_platform_versions=${{ env.ANDROID_PLATFORM_VERSIONS }}
          android_ndk_version=${{ env.ANDROID_NDK_VERSION }}
          cmake_version=${{ env.CMAKE_VERSION }}
