schema: spec-driven

context: |
  Flutter Docker Image provides minimal Docker images for Flutter CI, with tools predownloaded so containers run `flutter`
  commands without further downloads.
  Specs cover what a CI engineer would notice when pulling, running, or building with
  these images, and what the maintainer would notice when building, releasing, or
  reviewing changes to them.

rules:
  proposal:
    - Justify why this change requires a spec (reference the relevance gate)
  specs:
    - Every spec must trace to something the CI engineer or maintainer would notice or care about
    - Name the experience context where the change is noticed
    - Use GIVEN/WHEN/THEN format for behavioral scenarios
    - Architectural guardrails are constraints on how value is delivered to the CI engineer or maintainer — they must be load-bearing (violating one would degrade the CI engineer's or maintainer's experience)
    - Error classification determines whether the CI engineer or maintainer sees a warning or hard failure
    - On archive, sync the spec to reflect the shipped behavior
    - "CRITICAL: Reject if spec has no traceable impact on the CI engineer's or maintainer's experience"
    - 'CRITICAL: Reject if spec describes implementation without connection to what the CI engineer or maintainer would notice'
    - "CRITICAL: Reject if change contradicts or duplicates an existing spec's experience impact"
    - 'CRITICAL: Reject requirements that describe a one-time migration or rollout step; put those in design.md or tasks.md'
    - 'WARNING: Guardrail not justified as load-bearing'
    - 'WARNING: Missing GIVEN/WHEN/THEN for claimed behaviors'
    - 'WARNING: Scope too broad — multiple unrelated experience contexts'
