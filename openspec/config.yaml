schema: spec-driven

context: |
  Flutter Docker Image provides minimal Docker images for Flutter CI, with tools predownloaded so containers run `flutter`
  commands without further downloads.
  "The user" means the CI engineer pulling, running, or building with these images,
  or the maintainer building, releasing, or reviewing changes to them.

rules:
  proposal:
    - Justify why this change requires a spec (reference the relevance gate)
  specs:
    - Name the experience context where the change is noticed
    - Use GIVEN/WHEN/THEN format for behavioral scenarios
    - Architectural guardrails are constraints on how value is delivered to the user — they must be load-bearing (violating one would degrade the user's experience)
    - Error classification determines whether the user sees a warning or hard failure
    - On archive, sync the spec to reflect the shipped behavior
    - "CRITICAL: Reject if spec has no traceable impact on the user's experience"
    - 'CRITICAL: Reject if spec describes implementation without connection to what the user would notice'
    - "CRITICAL: Reject if change contradicts or duplicates an existing spec's experience impact"
    - 'CRITICAL: Reject requirements that describe a one-time migration or rollout step; put those in design.md or tasks.md'
    - 'WARNING: Guardrail not justified as load-bearing'
    - 'WARNING: Missing GIVEN/WHEN/THEN for claimed behaviors'
    - 'WARNING: Scope too broad — multiple unrelated experience contexts'
